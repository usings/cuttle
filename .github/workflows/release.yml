name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Production deploys should be serialized.
# Do not cancel a deployment that may already be applying migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CUTTLE_TOKEN: ${{ secrets.CUTTLE_TOKEN }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            CUTTLE_TOKEN
          do
            value="${!name:-}"

            if [ -z "${value//[[:space:]]/}" ]; then
              echo "::error::$name is unset or blank."
              exit 1
            fi
          done

      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build artifacts
        run: pnpm run build

      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail

          database_name="$(
            node -e '
              const fs = require("node:fs");
              const config = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));
              const db = config.d1_databases?.find(db => db.binding === "DB");

              if (!db?.database_name) {
                console.error('\''::error::D1 binding "DB" not found.'\'');
                process.exit(1);
              }

              process.stdout.write(db.database_name);
            '
          )"

          echo "D1 database: $database_name"

          if pnpm exec wrangler d1 list --json |
            node -e '
              const fs = require("node:fs");
              const databases = JSON.parse(fs.readFileSync(0, "utf8") || "[]");

              process.exit(
                databases.some(db => db.name === process.argv[1]) ? 0 : 1
              );
            ' "$database_name"
          then
            echo "D1 database '$database_name' already exists."
          else
            echo "Creating D1 database '$database_name'..."
            pnpm exec wrangler d1 create "$database_name"
          fi

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          set -euo pipefail

          secrets_file="$RUNNER_TEMP/cuttle-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT

          # Restrict the temporary secret file to the current user.
          umask 077

          SECRETS_FILE="$secrets_file" node -e '
            require("fs").writeFileSync(
              process.env.SECRETS_FILE,
              JSON.stringify({
                CUTTLE_TOKEN: process.env.CUTTLE_TOKEN
              })
            );
          '

          pnpm exec wrangler deploy --secrets-file "$secrets_file"
