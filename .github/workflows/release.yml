name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build artifacts
        run: pnpm run build

      - name: Ensure D1 database exists
        run: |
          set -euo pipefail
          pnpm wrangler d1 info "$D1_DATABASE_NAME" >/dev/null 2>&1 || {
            echo "Creating D1 database '$D1_DATABASE_NAME'..."
            pnpm wrangler d1 create "$D1_DATABASE_NAME"
          }
        env:
          D1_DATABASE_NAME: cuttle

      - name: Apply D1 migrations
        run: pnpm wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Workers
        env:
          CUTTLE_TOKEN: ${{ secrets.CUTTLE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CUTTLE_TOKEN:-}" ] || [ -z "${CUTTLE_TOKEN//[[:space:]]/}" ]; then
            echo "::error::CUTTLE_TOKEN is unset or blank. Set it under Settings → Secrets and variables → Actions before deploying."
            exit 1
          fi

          # Written through JSON.stringify so a token containing quotes or backslashes survives.
          node -e '
            require("fs").writeFileSync(
              "/tmp/secrets.json",
              JSON.stringify({
                CUTTLE_TOKEN: process.env.CUTTLE_TOKEN
              })
            )
          '

          pnpm wrangler deploy --secrets-file /tmp/secrets.json
